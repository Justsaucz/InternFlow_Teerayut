# No resources are applied until the initial Blueprint plan is approved.
services:
  - type: web
    name: internflow-teerayut-api
    runtime: docker
    branch: deploy/sites-render
    region: singapore
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://internflow-teerayut-justsaucz.eloquentorangutan2.chatgpt.site
      - key: DEMO_MODE
        value: "true"
      - key: FILE_STORAGE
        value: database
